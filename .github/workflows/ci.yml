name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap Ubuntu dependencies
        if: runner.os == 'Linux'
        run: ./scripts/install-dependencies-ubuntu.sh

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBASILISK_BUILD_GAME=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  build-web:
    name: Build WebAssembly (Emscripten 6.0.4)
    runs-on: ubuntu-latest
    container: emscripten/emsdk:6.0.4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Emscripten
        run: |
          emcc --version
          em++ --version
          command -v emcmake
          emcmake cmake --version

      - name: Configure
        run: >-
          emcmake cmake -S . -B build-web
          -DCMAKE_BUILD_TYPE=Release
          -DBASILISK_BUILD_GAME=ON
          -DBASILISK_BUILD_CLI=OFF
          -DBASILISK_BUILD_SIM=OFF
          -DBASILISK_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build-web --config Release

      - name: Verify browser artifacts
        shell: bash
        run: |
          test -s build-web/clients/game/BasiliskGame.html
          test -s build-web/clients/game/BasiliskGame.js
          test -s build-web/clients/game/BasiliskGame.wasm
          test -s build-web/clients/game/BasiliskGame.data

      - name: Upload browser artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BasiliskGame-web-emscripten-6.0.4
          path: |
            build-web/clients/game/BasiliskGame.html
            build-web/clients/game/BasiliskGame.js
            build-web/clients/game/BasiliskGame.wasm
            build-web/clients/game/BasiliskGame.data
          if-no-files-found: error

      - name: Assemble deployable web package
        run: >-
          cmake --build build-web --config Release
          --target BasiliskGameWebPackage

      - name: Validate deployable web package
        shell: bash
        run: |
          set -euo pipefail
          package=build-web/web-package
          test -s "${package}/index.html"
          test -s "${package}/BasiliskGame.js"
          test -s "${package}/BasiliskGame.wasm"
          test -s "${package}/BasiliskGame.data"
          grep -Fq 'BasiliskGame.js' "${package}/index.html"
          grep -Fq 'BasiliskGame.wasm' "${package}/BasiliskGame.js"
          grep -Fq 'BasiliskGame.data' "${package}/BasiliskGame.js"
          grep -Fq '/assets/fonts/Inter-Regular.ttf' "${package}/BasiliskGame.js"
          grep -Fq '/assets/ui/basilisk-logo.svg' "${package}/BasiliskGame.js"
          grep -Fq '/assets/items/healing-draught.svg' "${package}/BasiliskGame.js"
          grep -Fq '/assets/emblems/circle.svg' "${package}/BasiliskGame.js"
          test -z "$(find "${package}" -type f \( -name '*BasiliskGameDebug*' -o -name '*BasiliskServer*' \) -print -quit)"

      - name: Upload deployable web package
        uses: actions/upload-artifact@v4
        with:
          name: BasiliskGame-WebAssembly
          path: build-web/web-package/
          if-no-files-found: error

  package-macos:
    name: Package macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Release package
        run: >-
          cmake -S . -B build-package
          -DCMAKE_BUILD_TYPE=Release
          -DBASILISK_BUILD_GAME=ON
          -DBASILISK_BUILD_CLI=OFF
          -DBASILISK_BUILD_SIM=OFF
          -DBASILISK_BUILD_TESTS=OFF

      - name: Build DMG
        run: cmake --build build-package --config Release --target package

      - name: Validate DMG contents
        shell: bash
        run: |
          set -euo pipefail
          package="$(find build-package -maxdepth 1 -name 'Basilisk-*-macOS-*.dmg' -type f -print -quit)"
          test -n "${package}"
          test -s "${package}"

          mount_point="${RUNNER_TEMP}/basilisk-dmg"
          mkdir -p "${mount_point}"
          hdiutil attach -readonly -nobrowse -mountpoint "${mount_point}" "${package}"
          trap 'hdiutil detach "${mount_point}"' EXIT

          app="${mount_point}/BasiliskGame.app"
          test -x "${app}/Contents/MacOS/BasiliskGame"
          test -s "${app}/Contents/Resources/BasiliskGame.icns"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "${app}/Contents/Info.plist")" = "BasiliskGame.icns"
          test -d "${app}/Contents/Resources/assets/fonts"
          test -d "${app}/Contents/Resources/assets/ui"
          test -d "${app}/Contents/Resources/assets/items"
          test -d "${app}/Contents/Resources/assets/emblems"
          test -s "${app}/Contents/Resources/assets/fonts/Inter-Regular.ttf"
          test -s "${app}/Contents/Resources/assets/ui/basilisk-logo.svg"
          test -s "${app}/Contents/Resources/assets/items/healing-draught.svg"
          test -s "${app}/Contents/Resources/assets/emblems/circle.svg"
          test ! -e "${mount_point}/BasiliskGameDebug"
          test ! -e "${mount_point}/BasiliskServer"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: BasiliskGame-macOS-${{ runner.arch }}
          path: build-package/Basilisk-*-macOS-*.dmg
          if-no-files-found: error

  package-windows:
    name: Package Windows ZIP
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Release package
        run: >-
          cmake -S . -B build-package
          -DCMAKE_BUILD_TYPE=Release
          -DBASILISK_BUILD_GAME=ON
          -DBASILISK_BUILD_CLI=OFF
          -DBASILISK_BUILD_SIM=OFF
          -DBASILISK_BUILD_TESTS=OFF

      - name: Build ZIP
        run: cmake --build build-package --config Release --target package

      - name: Validate ZIP contents
        shell: pwsh
        run: |
          $package = Get-ChildItem build-package -Filter 'Basilisk-*-Windows-*.zip' |
              Select-Object -First 1
          if (-not $package -or $package.Length -eq 0) {
              throw 'The Windows release ZIP was not generated.'
          }

          $expanded = Join-Path $env:RUNNER_TEMP 'basilisk-package'
          Expand-Archive -LiteralPath $package.FullName -DestinationPath $expanded

          $requiredPaths = @(
              'BasiliskGame.exe',
              'assets/fonts',
              'assets/ui',
              'assets/items',
              'assets/emblems',
              'assets/fonts/Inter-Regular.ttf',
              'assets/ui/basilisk-logo.svg',
              'assets/items/healing-draught.svg',
              'assets/emblems/circle.svg'
          )
          foreach ($relativePath in $requiredPaths) {
              if (-not (Test-Path (Join-Path $expanded $relativePath))) {
                  throw "Missing required package path: $relativePath"
              }
          }

          if (Get-ChildItem $expanded -Recurse -File |
                  Where-Object { $_.Name -in @('BasiliskGameDebug.exe', 'BasiliskServer.exe') }) {
              throw 'The shipping ZIP contains a debug or server executable.'
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: BasiliskGame-Windows-${{ runner.arch }}
          path: build-package/Basilisk-*-Windows-*.zip
          if-no-files-found: error
